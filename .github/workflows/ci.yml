name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
  reproduce:
    # Exact environment used for the paper: checksum + all statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-lock.txt && python -m pip install --no-deps -e .
      - run: python scripts/verify_reproduction.py
      - run: python scripts/benchmark_estimators.py --reps 1 --quick --out /tmp/bench_quick.csv
      - run: python scripts/make_figures.py --only 1 2 3 4
